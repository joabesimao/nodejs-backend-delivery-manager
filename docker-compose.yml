services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres_container
    restart: always
    environment:
      POSTGRES_DB: CadClient
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
    ports:
      # Só acessível pela própria máquina.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
