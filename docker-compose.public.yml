services:
  postgres:
    image: postgres:16-alpine
    container_name: fastone_postgres_public
    restart: unless-stopped
    environment:
      POSTGRES_DB: CadClient
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
    ports:
      # Só acessível pela própria máquina; a API usa a rede interna do compose.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d CadClient"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_public_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile.public
    container_name: fastone_api_public
    restart: unless-stopped
    env_file:
      - .env.public
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"

  frontend:
    build:
      context: ../delivery-fastOne-front
      dockerfile: Dockerfile.public
      args:
        VITE_API_BASE_URL: http://localhost:3000/api
        VITE_DELIVERY_COMPANY_NAME: FastOne Delivery
        VITE_DELIVERY_COMPANY_DOCUMENT: 00.000.000/0001-00
        VITE_DELIVERY_SHEET_FORMAT: a4
    container_name: fastone_front_public
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  postgres_public_data:
