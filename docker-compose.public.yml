services:
  mysql:
    image: mysql:8.0
    container_name: fastone_mysql_public
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: CadClient
      MYSQL_USER: myuser
      MYSQL_PASSWORD: mypassword
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - mysql_public_data:/var/lib/mysql

  api:
    build:
      context: .
      dockerfile: Dockerfile.public
    container_name: fastone_api_public
    restart: unless-stopped
    env_file:
      - .env.public
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "3000:3000"

  frontend:
    build:
      context: ../delivery-fastOne-front
      dockerfile: Dockerfile.public
      args:
        VITE_API_BASE_URL: http://localhost:3000/api
        VITE_DEFAULT_LOGIN: admin@fastone.local
        VITE_DEFAULT_PASSWORD: 123456
        VITE_DELIVERY_COMPANY_NAME: FastOne Delivery
        VITE_DELIVERY_COMPANY_DOCUMENT: 00.000.000/0001-00
        VITE_DELIVERY_SHEET_FORMAT: a4
    container_name: fastone_front_public
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  mysql_public_data:
